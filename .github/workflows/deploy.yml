name: Deploy Trading Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Run Unit Tests
        run: |
          python3 -m venv .test_venv
          .test_venv/bin/pip install --upgrade pip -q
          .test_venv/bin/pip install -r requirements.txt -q
          .test_venv/bin/pip install pytest pytest-asyncio -q
          .test_venv/bin/python -m pytest tests/ -v
          rm -rf .test_venv

      - name: 3. Sync Files to Pi
        run: |
          # Sync files while protecting all local data stores.
          #
          # IMPORTANT: --delete removes anything in the destination that is not
          # in the repo. Every runtime data file is gitignored, so it only
          # survives a deploy if it is excluded here. Adding a new persisted
          # file to config.py means adding it to this list too, or it gets
          # silently wiped on the next push.
          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'venv/' \
            --exclude '.git/' \
            --exclude '.req_hash' \
            --exclude 'downloads/' \
            --exclude 'knowledge_base/' \
            --exclude 'chroma_db/' \
            --exclude 'backups/' \
            --exclude 'rebuild_state.json' \
            --exclude 'trade_checklist_live.json' \
            --exclude 'master_insights.json' \
            --exclude 'last_analyzed.txt' \
            --exclude 'missed_insights.json' \
            --exclude 'last_missed_analyzed.txt' \
            --exclude 'psych_log.jsonl' \
            --exclude 'coach_log.jsonl' \
            --exclude 'coach_settings.json' \
            --exclude 'coach_chat/' \
            --exclude 'failed_trades.json' \
            --exclude 'failed_missed.json' \
            ./ /home/malith/bot/

      - name: 4. Update System Service File
        run: |
          # Overwrite the old system configuration with the one from the repo
          sudo cp /home/malith/bot/tradingbot.service /etc/systemd/system/tradingbot.service
          
          # Tell the Pi to reload the new configuration
          sudo systemctl daemon-reload
          
          # Ensure the service is set to start on boot
          sudo systemctl enable tradingbot

      - name: 5. Update Dependencies & Restart
        run: |
          cd /home/malith/bot

          # Wipe the venv to clear out the legacy ChromaDB/Pydantic versions
          rm -rf venv
          python3 -m venv venv
          
          # Install fresh modern dependencies
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

          # Ensure the embedding model is ready
          ollama pull nomic-embed-text

          # Run the re-index script
          ./venv/bin/python scripts/reindex_all.py
          
          # Restart the bot
          sudo systemctl restart tradingbot

      - name: 6. Verify Deployment Health
        run: |
          # Wait a few seconds for the bot to attempt to log in
          sleep 10
          
          # Check if the service is still active
          if sudo systemctl is-active --quiet tradingbot; then
            echo "✅ Bot is running successfully!"
          else
            echo "❌ Bot failed to start or crashed after restart!"
            # Get the last 20 lines of logs to show in GitHub Actions
            sudo journalctl -u tradingbot -n 20
            exit 1
          fi